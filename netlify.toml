# Netlify: build and publish automatically on every push to GitHub
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the entry page must never be cached by the CDN/browser,
# otherwise phones would not notice new versions of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Built files have a content hash in their name: cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
